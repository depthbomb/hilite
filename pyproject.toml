[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'hilite'
version = '0.1.0'
description = 'TextMate grammar highlighting rendered as self-contained HTML'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.14'
authors = [{ name = 'depthbomb' }]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.14',
    'Topic :: Text Processing :: Markup :: HTML',
    'Topic :: Software Development :: Libraries :: Python Modules',
]

[project.optional-dependencies]
browser-test = ['playwright>=1.55']
dev = [
    'build>=1.3',
    'mypy>=1.18.2',
    'pytest>=8.4',
    'pytest-cov>=7',
    'ruff>=0.13',
    'twine>=6',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hilite']
exclude = ['**/*.pyd', '**/*.so', '**/*.dll', '**/*.dylib']

[tool.hatch.build.hooks.custom]
path = 'hatch_build.py'

[tool.hatch.build.targets.sdist]
include = ['/src', '/examples', '/tests', '/benchmarks', '/native', '/hatch_build.py', '/README.md', '/LICENSE', '/pyproject.toml']
exclude = ['/native/target', '**/*.pyd', '**/*.so', '**/*.dll', '**/*.dylib']

[tool.pytest.ini_options]
addopts = '-ra --strict-config --strict-markers'
testpaths = ['tests']

[tool.mypy]
python_version = '3.14'
strict = true
files = ['src/hilite']

[tool.cibuildwheel]
build = 'cp314-*'
skip = '*-musllinux_*'
archs = ['native']
build-frontend = 'build'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = 'manylinux_2_28'
before-all = 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/hilite-rustup.sh && sh /tmp/hilite-rustup.sh -y --profile minimal --default-toolchain stable'
environment = { PATH = '$HOME/.cargo/bin:$PATH' }

[tool.ruff]
line-length = 100
target-version = 'py314'
extend-exclude = ['native/vendor', 'native/target']

[tool.ruff.lint]
select = ['E', 'F', 'UP', 'B', 'SIM', 'RUF']
# Full import statement length is the ordering convention; isort sorts module names.
ignore = ['UP045']

[tool.ruff.format]
quote-style = 'single'
